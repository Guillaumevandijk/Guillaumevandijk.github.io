<!DOCTYPE html>
<html lang="nl">
<head>
  <link rel="icon" href="fitcamp_2026.jpg" type="image/jpeg">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="ai">

  <section id="appSection" class="app-section" hidden>
    <header class="app-header">
      <h1>Chat met AI</h1>
      <button type="button" id="logoutBtn" class="logout-btn">Uitloggen</button>

      <input id="chatInput" placeholder="Stel een vraag..." />

    </div>
    <div id="chatOutput" class="chat-output"></div>
  </section>

  <script type="module" src="js/ai.js"></script>

</body>
