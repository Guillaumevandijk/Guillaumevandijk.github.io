<!DOCTYPE html>
<html lang="nl">
<head>
  <link rel="apple-touch-icon" href="doh.jpeg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">

  <section id="appSection" class="app-section" hidden>
    <header class="app-header">
      <h1>Doelen</h1>
      <div class="header-actions">
        <button type="button" id="logoutBtn" class="logout-btn">Uitloggen</button>
      </div>
    </header>

    <section class="settings-block">
      <div class="goals-heading">
        <h2>Lange termijn</h2>
        <div class="goals-actions">
          <button type="button" id="changeGoalsBtn" class="forecast-toggle">Wijzigen</button>
          <button type="button" id="saveGoalsBtn" class="forecast-toggle forecast-toggle--active" hidden>Opslaan</button>
          <button type="button" id="cancelGoalsBtn" class="forecast-toggle" hidden>Annuleren</button>
        </div>
      </div>
      <ol id="longGoals" class="goal-list"></ol>
    </section>

    <section class="settings-block">
      <h2>Korte termijn</h2>
      <ol id="shortGoals" class="goal-list"></ol>
    </section>

    <section class="settings-block">
      <h2>Notities</h2>
      <div class="input-row">
        <input id="noteInput" type="text" placeholder="Notitie" />
        <button type="button" id="addNoteBtn">Toevoegen</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Notitie</th>
            <th>Wanneer</th>
          </tr>
        </thead>
        <tbody id="notesTableBody"></tbody>
      </table>
    </section>
  </section>

  <script type="module" src="js/home.js"></script>

</body>
</html>
